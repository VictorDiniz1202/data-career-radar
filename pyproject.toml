[project]
name = "career-radar"
version = "0.1.0"
description = "A robust ETL pipeline to discover and rank remote data career opportunities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "psycopg2-binary>=2.9.9",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.2.0",
    "flake8>=7.0.0",
]

[project.scripts]
career-radar = "career_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_radar"]
